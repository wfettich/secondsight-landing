<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SecondSight — Turn an old phone into a security camera</title>
<meta name="description" content="SecondSight turns an old phone into a live-streaming security camera you can watch from any browser. Private beta — take our one-minute survey.">
<!--
  TODO analytics: sign up for Plausible (plausible.io) or GoatCounter (goatcounter.com)
  yourself, then paste the tracking snippet here. Neither can be set up on your behalf.
  Suggested events to track: pageview (default) + a custom "survey-click" event on the
  elements with [data-survey-link], so you can see click-through rate to the form.
-->
<style>
  :root {
    --bg: #0b0f14;
    --bg-elev: #121822;
    --border: #232d3a;
    --text: #eef2f6;
    --text-dim: #9aa7b5;
    --accent: #5eead4;
    --accent-dim: #164e46;
    --warn-bg: #241d0d;
    --warn-border: #4a3b12;
    --warn-text: #e0c46a;
    --radius: 14px;
    --maxw: 880px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.55;
  }
  a { color: var(--accent); }
  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 20px; }

  header.site {
    position: sticky; top: 0; z-index: 10;
    backdrop-filter: blur(10px);
    background: rgba(11,15,20,0.85);
    border-bottom: 1px solid var(--border);
  }
  header.site .wrap {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 14px; padding-bottom: 14px;
  }
  .brand { font-weight: 700; font-size: 1.1rem; letter-spacing: -0.02em; }
  .lang-toggle {
    display: flex; gap: 4px; background: var(--bg-elev);
    border: 1px solid var(--border); border-radius: 999px; padding: 3px;
  }
  .lang-toggle button {
    border: none; background: transparent; color: var(--text-dim);
    padding: 6px 14px; border-radius: 999px; font-size: 0.85rem; cursor: pointer;
    font-weight: 600;
  }
  .lang-toggle button[aria-pressed="true"] { background: var(--accent); color: #04201c; }

  section { padding: 64px 0; border-bottom: 1px solid var(--border); }
  section:last-of-type { border-bottom: none; }

  .badge {
    display: inline-block; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--accent); background: var(--accent-dim);
    padding: 5px 12px; border-radius: 999px; margin-bottom: 18px;
  }
  h1 { font-size: clamp(2rem, 5vw, 2.9rem); line-height: 1.12; margin: 0 0 18px; letter-spacing: -0.02em; }
  .hero p.tagline { font-size: 1.15rem; color: var(--text); font-weight: 600; max-width: 640px; margin: 0 0 12px; }
  .hero p.lead { font-size: 1.02rem; color: var(--text-dim); max-width: 640px; margin: 0 0 30px; }
  h2 { font-size: clamp(1.5rem, 3.5vw, 1.9rem); margin: 0 0 10px; letter-spacing: -0.01em; }
  .section-lead { color: var(--text-dim); max-width: 640px; margin: 0 0 32px; }

  .btn {
    display: inline-block; background: var(--accent); color: #04201c;
    font-weight: 700; padding: 14px 26px; border-radius: 999px; text-decoration: none;
    font-size: 1.02rem; transition: transform .15s ease, box-shadow .15s ease;
    box-shadow: 0 0 0 rgba(94,234,212,0);
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(94,234,212,0.25); }
  .btn-sub { color: var(--text-dim); font-size: 0.88rem; margin-top: 12px; }

  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
  .step { background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; }
  .step .num {
    width: 30px; height: 30px; border-radius: 50%; background: var(--accent-dim);
    color: var(--accent); display: flex; align-items: center; justify-content: center;
    font-weight: 700; margin-bottom: 14px; font-size: 0.9rem;
  }
  .step h3 { margin: 0 0 6px; font-size: 1.02rem; }
  .step p { margin: 0; color: var(--text-dim); font-size: 0.94rem; }

  .cta-box {
    background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 36px; text-align: center;
  }
  .cta-box p { color: var(--text-dim); max-width: 520px; margin: 0 auto 22px; }


  .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  .status-card { background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; }
  .status-card h3 { margin: 0 0 14px; font-size: 1.05rem; }
  .status-card ul { list-style: none; margin: 0; padding: 0; }
  .status-card li { position: relative; padding: 0 0 10px 28px; color: var(--text-dim); font-size: 0.95rem; }
  .status-card li:last-child { padding-bottom: 0; }
  .status-card li::before { position: absolute; left: 0; top: 0; font-weight: 700; }
  .status-card.now li::before { content: "\2713"; color: var(--accent); }
  .status-card.next li::before { content: "\2192"; color: var(--warn-text); }
  .status-card.now h3 { color: var(--accent); }
  .status-card.next h3 { color: var(--warn-text); }
  .status-more { color: var(--text-dim); font-size: 0.92rem; margin: 18px 0 0; }

  footer.site { padding: 34px 0 50px; color: var(--text-dim); font-size: 0.88rem; }

  @media (max-width: 700px) {
    .steps, .status-grid { grid-template-columns: 1fr; }
    section { padding: 44px 0; }
  }
</style>
</head>
<body>

<header class="site">
  <div class="wrap">
    <div class="brand">SecondSight</div>
    <div class="lang-toggle" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="ro" aria-pressed="false">RO</button>
    </div>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <span class="badge" data-i18n="hero.badge"></span>
    <h1 data-i18n="hero.title"></h1>
    <p class="tagline" data-i18n="hero.tagline"></p>
    <p class="lead" data-i18n="hero.lead"></p>
    <a class="btn" data-i18n="hero.cta" data-survey-link href="#" target="_blank" rel="noopener"></a>
  </div>
</section>

<section id="how">
  <div class="wrap">
    <h2 data-i18n="how.title"></h2>
    <p class="section-lead" data-i18n="how.lead"></p>
    <div class="steps">
      <div class="step">
        <div class="num">1</div>
        <h3 data-i18n="how.step1.title"></h3>
        <p data-i18n="how.step1.body"></p>
      </div>
      <div class="step">
        <div class="num">2</div>
        <h3 data-i18n="how.step2.title"></h3>
        <p data-i18n="how.step2.body"></p>
      </div>
      <div class="step">
        <div class="num">3</div>
        <h3 data-i18n="how.step3.title"></h3>
        <p data-i18n="how.step3.body"></p>
      </div>
    </div>
  </div>
</section>

<section id="status">
  <div class="wrap">
    <h2 data-i18n="status.title"></h2>
    <p class="section-lead" data-i18n="status.lead"></p>
    <div class="status-grid">
      <div class="status-card now">
        <h3 data-i18n="status.now.title"></h3>
        <ul>
          <li data-i18n="status.now.i1"></li>
          <li data-i18n="status.now.i2"></li>
          <li data-i18n="status.now.i3"></li>
          <li data-i18n="status.now.i4"></li>
          <li data-i18n="status.now.i5"></li>
        </ul>
      </div>
      <div class="status-card next">
        <h3 data-i18n="status.next.title"></h3>
        <ul>
          <li data-i18n="status.next.i1"></li>
          <li data-i18n="status.next.i2"></li>
          <li data-i18n="status.next.i3"></li>
          <li data-i18n="status.next.i4"></li>
          <li data-i18n="status.next.i5"></li>
          <li data-i18n="status.next.i6"></li>
          <li data-i18n="status.next.i7"></li>
        </ul>
      </div>
    </div>
    <p class="status-more" data-i18n="status.more"></p>
  </div>
</section>

<section id="why">
  <div class="wrap">
    <h2 data-i18n="why.title"></h2>
    <p class="section-lead" data-i18n="why.body"></p>
  </div>
</section>

<section id="survey">
  <div class="wrap">
    <div class="cta-box">
      <h2 data-i18n="cta.title"></h2>
      <p data-i18n="cta.body"></p>
      <a class="btn" data-i18n="cta.button" data-survey-link href="#" target="_blank" rel="noopener"></a>
      <div class="btn-sub" data-i18n="cta.sub"></div>
    </div>
  </div>
</section>

<footer class="site">
  <div class="wrap">
    <span data-i18n="footer.text"></span>
  </div>
</footer>

<script>
const SURVEY_LINKS = {
  en: "https://docs.google.com/forms/d/1SBcMhcV90_8P2jntN9Fs37edHEshFhHHnDwxC5ZY90M/viewform",
  ro: "https://docs.google.com/forms/d/172B3AGhx25FZPJuLq6e_XJKgx-G5WZOjOlhvycqdevU/viewform"
};

const I18N = {
  en: {
    hero: {
      badge: "Beta · Private testing",
      title: "Turn an old phone into a live security camera.",
      tagline: "SecondSight is a mobile app that allows you to use an old phone as a security camera. Ease of use and privacy are our main objectives.",
      lead: "Watch from any browser today. An app viewer is on the way too. Video is stored locally on the camera by default. Cloud backup in future releases. Currently in private beta, and we're building it based on real feedback.",
      cta: "Take the one-minute survey"
    },
    how: {
      title: "How it works",
      lead: "SecondSight runs on the phone you already have sitting in a drawer.",
      step1: { title: "Install on an old phone", body: "The SecondSight camera app runs on iOS or Android — any spare device becomes the camera." },
      step2: { title: "It streams live, peer-to-peer", body: "Video is sent directly (WebRTC) to whoever you share the link with — our server only helps the two devices connect." },
      step3: { title: "Watch from any browser", body: "Open the private link on a laptop or another phone. No separate viewer app to install." }
    },
    status: {
      title: "What works today, and what's next",
      lead: "An honest snapshot of where SecondSight is right now.",
      now: {
        title: "Available now",
        i1: "Live streaming and recording on the device",
        i2: "Watch your recordings on the device",
        i3: "Motion detection, with recording triggered by motion",
        i4: "No-config access from outside your home, over cellular",
        i5: "Live viewing in any browser"
      },
      next: {
        title: "Planned",
        i1: "Viewer mode in the app, so you can receive notifications",
        i2: "App translations: Romanian, Polish and more",
        i3: "Link your own cloud drive (Google Drive, OneDrive, etc.) for archive storage",
        i4: "Access control: only you and the people you share with can open the stream",
        i5: "2-way audio",
        i6: "Multi-camera view: watch several cameras from the same app",
        i7: "Low-light vision"
      },
      more: "…and many more. You're helping us shape the next features, so tell us what matters most in the survey below."
    },
    why: {
      title: "Why we're asking",
      body: "SecondSight is work in progress. Before we build further, we want to hear from people who've actually dealt with surveillance-camera apps — what worked, what didn't, and what would make you use this. The survey takes about one minute and most questions are optional. If you'd like to join the beta, we'll ask for your name, email and device platform (iOS, Android or both) so we can send you build updates."
    },
    cta: {
      title: "Tell us what you need",
      body: "Your answers directly shape what gets built next — and what doesn't.",
      button: "Take the survey",
      sub: "Want early access? Answer yes to testing the app and leave your name, email and platform — that's the only way we collect them."
    },
    footer: { text: "© SecondSight" }
  },
  ro: {
    hero: {
      badge: "Beta · Testare privată",
      title: "Transformă un telefon vechi într-o cameră de supraveghere live.",
      tagline: "SecondSight este o aplicație mobilă care îți permite să folosești un telefon vechi ca cameră de supraveghere. Ușurința de utilizare și confidențialitatea sunt obiectivele noastre principale.",
      lead: "Vizionează acum din browser. Va urma și un viewer în aplicație. Video-ul este stocat local pe cameră în mod implicit. Va urma backup opțional în cloud. În prezent în beta privat, iar dezvoltarea se bazează pe feedback real.",
      cta: "Completează sondajul de un minut"
    },
    how: {
      title: "Cum funcționează",
      lead: "SecondSight rulează pe telefonul pe care îl ai deja într-un sertar.",
      step1: { title: "Instalează pe un telefon vechi", body: "Aplicația cameră SecondSight rulează pe iOS sau Android — orice dispozitiv nefolosit devine cameră." },
      step2: { title: "Transmite live, peer-to-peer", body: "Video-ul este trimis direct (WebRTC) către persoana cu care distribui linkul — serverul nostru ajută doar cele două dispozitive să se conecteze." },
      step3: { title: "Vizionează din orice browser", body: "Deschide linkul privat pe un laptop sau alt telefon. Nu e nevoie de nicio aplicație separată pentru vizionare." }
    },
    status: {
      title: "Ce funcționează azi și ce urmează",
      lead: "Un instantaneu sincer al stadiului actual al SecondSight.",
      now: {
        title: "Disponibil acum",
        i1: "Transmisie live și înregistrare pe dispozitiv",
        i2: "Vizionarea înregistrărilor pe dispozitiv",
        i3: "Detectare de mișcare, cu înregistrare declanșată de mișcare",
        i4: "Acces din exterior fără configurare, prin rețea celulară",
        i5: "Vizionare live din orice browser"
      },
      next: {
        title: "Planificat",
        i1: "Mod viewer în aplicație, pentru a primi notificări",
        i2: "Traduceri ale aplicației: română, poloneză și altele",
        i3: "Conectează-ți propriul cloud (Google Drive, OneDrive etc.) pentru stocarea arhivei",
        i4: "Securitate: doar tu și persoanele cu care partajezi puteți accesa transmisia",
        i5: "Audio bidirecțional",
        i6: "Vizualizare multi-cameră: urmărești mai multe camere din aceeași aplicație",
        i7: "Vedere pe lumină slabă"
      },
      more: "…și multe altele. Ne ajuți să conturăm următoarele funcții, așa că spune-ne în sondajul de mai jos ce contează cel mai mult pentru tine."
    },
    why: {
      title: "De ce întrebăm",
      body: "SecondSight este încă în lucru. Înainte să continuăm dezvoltarea, vrem să auzim părerile celor care au folosit aplicații de supraveghere — ce a funcționat, ce nu, și de ce ar folosi asta. Sondajul durează aproximativ un minut, iar majoritatea întrebărilor sunt opționale. Dacă vrei să te alături beta-ului, îți vom cere numele, e-mailul și platforma dispozitivului (iOS, Android sau ambele) ca să-ți putem trimite actualizările versiunilor."
    },
    cta: {
      title: "Spune-ne de ce ai nevoie",
      body: "Răspunsurile tale influențează direct ce construim în continuare — și ce nu.",
      button: "Completează sondajul",
      sub: "Vrei acces anticipat? Răspunde „da” la testarea aplicației și lasă-ți numele, e-mailul și platforma — este singura modalitate prin care le colectăm."
    },
    footer: { text: "© SecondSight" }
  }
};

function render(lang) {
  document.documentElement.lang = lang;
  const dict = I18N[lang];

  document.querySelectorAll("[data-i18n]").forEach(el => {
    const path = el.getAttribute("data-i18n").split(".");
    let val = dict;
    for (const p of path) val = val && val[p];
    if (typeof val === "string") {
      el.textContent = val;
      el.hidden = val === "";
    }
  });

  document.querySelectorAll("[data-survey-link]").forEach(el => {
    el.href = SURVEY_LINKS[lang];
  });

  document.querySelectorAll(".lang-toggle button").forEach(btn => {
    btn.setAttribute("aria-pressed", btn.dataset.lang === lang ? "true" : "false");
  });
}

function langFromUrl() {
  const l = (new URLSearchParams(location.search).get("lang") || "").toLowerCase();
  return l === "en" || l === "ro" ? l : null;
}

function setUrlLang(lang) {
  try {
    const url = new URL(location.href);
    url.searchParams.set("lang", lang);
    history.replaceState(null, "", url);
  } catch (e) {}
}

function detectInitialLang() {
  const fromUrl = langFromUrl();
  if (fromUrl) return fromUrl;
  try {
    const saved = localStorage.getItem("ss-lang");
    if (saved === "en" || saved === "ro") return saved;
  } catch (e) {}
  return (navigator.language || "").toLowerCase().startsWith("ro") ? "ro" : "en";
}

document.querySelectorAll(".lang-toggle button").forEach(btn => {
  btn.addEventListener("click", () => {
    const lang = btn.dataset.lang;
    try { localStorage.setItem("ss-lang", lang); } catch (e) {}
    setUrlLang(lang);
    render(lang);
  });
});

const initialLang = detectInitialLang();
if (!langFromUrl()) setUrlLang(initialLang);
render(initialLang);
</script>

</body>
</html>
